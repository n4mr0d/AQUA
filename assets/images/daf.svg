<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="dafBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#dafBg)" />
  
  <!-- DAF Unit Schematic -->
  <g transform="translate(50, 45)">
    <!-- Main Flotation Basin -->
    <path d="M10 40 L60 40 L80 120 L240 120 L270 40 L290 40" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <polygon points="60,40 80,120 240,120 270,40" fill="#0284C7" opacity="0.3" />
    
    <!-- Microbubble cloud -->
    <g fill="#FFFFFF" opacity="0.75">
      <circle cx="100" cy="100" r="1.5" /><circle cx="120" cy="90" r="2" /><circle cx="110" cy="80" r="1.5" />
      <circle cx="140" cy="105" r="2.5" /><circle cx="150" cy="75" r="2" /><circle cx="170" cy="85" r="1.5" />
      <circle cx="190" cy="95" r="2" /><circle cx="180" cy="70" r="2.5" /><circle cx="210" cy="80" r="2" />
      <circle cx="230" cy="90" r="1.8" /><circle cx="160" cy="65" r="2" />
    </g>
    
    <!-- Floating Sludge Layer (Top surface) -->
    <rect x="70" y="36" width="190" height="12" rx="4" fill="#92400E" opacity="0.85" />
    
    <!-- Surface Scraper Mechanism -->
    <line x1="80" y1="30" x2="250" y2="30" stroke="#F59E0B" stroke-width="2" />
    <circle cx="80" cy="30" r="6" fill="#F59E0B" />
    <circle cx="250" cy="30" r="6" fill="#F59E0B" />
    <path d="M140 24 L140 38" stroke="#F59E0B" stroke-width="3" />
    <path d="M200 24 L200 38" stroke="#F59E0B" stroke-width="3" />
    
    <!-- Sludge Beach & Trough -->
    <polygon points="250,42 270,30 270,60 250,55" fill="#B45309" />
    <rect x="270" y="45" width="25" height="35" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- White Water Pressurization Loop (Compressor + Pump) -->
    <path d="M220 120 L220 155 L60 155 L60 100" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="5 3" />
    <rect x="130" y="145" width="40" height="20" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5" />
    <text x="150" y="159" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">AIR-SAT</text>
  </g>

  <text x="30" y="38" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FLOTTATION À AIR DISSOUS</text>
  <text x="30" y="238" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Unités DAF &amp; Séparation Physico-chimique Industrielle</text>
</svg>
