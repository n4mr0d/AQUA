<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#134E5E" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.1">
    <line x1="40" y1="0" x2="40" y2="260" /><line x1="120" y1="0" x2="120" y2="260" /><line x1="200" y1="0" x2="200" y2="260" />
    <line x1="280" y1="0" x2="280" y2="260" /><line x1="360" y1="0" x2="360" y2="260" />
    <line x1="0" y1="65" x2="400" y2="65" /><line x1="0" y1="130" x2="400" y2="130" /><line x1="0" y1="195" x2="400" y2="195" />
  </g>
  
  <!-- Filtration Column System (Hydrasand / Sand Filter / Screens) -->
  <g transform="translate(130, 30)">
    <!-- Main Vessel Cylindrical -->
    <rect x="25" y="20" width="90" height="150" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <!-- Filter Media Layers -->
    <rect x="29" y="50" width="82" height="30" fill="#0284C7" opacity="0.6" />
    <rect x="29" y="82" width="82" height="35" fill="#0369A1" opacity="0.75" />
    <rect x="29" y="119" width="82" height="30" fill="#075985" opacity="0.9" />
    
    <!-- Nozzles & Planchers filtrants -->
    <line x1="29" y1="152" x2="111" y2="152" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 3" />
    <circle cx="45" cy="158" r="3" fill="#38BDF8" /><circle cx="70" cy="158" r="3" fill="#38BDF8" /><circle cx="95" cy="158" r="3" fill="#38BDF8" />
    
    <!-- Top & Bottom Flanges -->
    <rect x="15" y="16" width="110" height="8" rx="3" fill="#94A3B8" />
    <rect x="15" y="168" width="110" height="8" rx="3" fill="#94A3B8" />
    
    <!-- Inlet Pipe (Top) -->
    <path d="M70 0 L70 16" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
    <!-- Outlet Pipe (Bottom) -->
    <path d="M70 176 L70 200" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
    <!-- Washwater return -->
    <path d="M115 40 L145 40 L145 130 L115 130" fill="none" stroke="#00E5FF" stroke-width="4" stroke-dasharray="6 4" />
  </g>

  <!-- Technical Overlay Labels -->
  <text x="30" y="45" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CONTINUOUS FILTRATION</text>
  <text x="30" y="235" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Systèmes de Filtration &amp; Crépines Andritz</text>
</svg>
