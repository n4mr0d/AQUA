<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#004B87" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A3E0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hydraulic Droplet & Flow Mark -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Outer Turbine / Hydro Shield Ring -->
    <circle cx="36" cy="36" r="34" fill="none" stroke="url(#aquaGrad)" stroke-width="3.5" stroke-dasharray="160 20" opacity="0.9" />
    
    <!-- Fluid Waves Wave 1 -->
    <path d="M16 46 C24 38, 30 52, 42 42 C48 37, 54 44, 58 41 C59 47, 56 55, 48 59 C38 64, 24 62, 16 46 Z" fill="url(#aquaGrad)" opacity="0.85" />
    
    <!-- Dynamic Water Droplet -->
    <path d="M36 12 C36 12, 50 30, 50 40 C50 48, 43.7 54, 36 54 C28.3 54, 22 48, 22 40 C22 30, 36 12, 36 12 Z" fill="url(#accentGrad)" />
    
    <!-- Inner Core Hydro Sparkle -->
    <circle cx="31" cy="34" r="3.5" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Flow Vector Curve -->
    <path d="M18 36 C24 24, 46 22, 54 32" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Typography Brand -->
  <text x="96" y="44" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#0B2545">
    AQUA<tspan fill="#00A3E0">EQUIPEMENT</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="98" y="66" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#004B87">
    ÉQUIPEMENTS &amp; SYSTÈMES HYDROMÉCANIQUES
  </text>
  
  <rect x="98" y="74" width="48" height="2.5" rx="1.2" fill="url(#aquaGrad)" />
</svg>
