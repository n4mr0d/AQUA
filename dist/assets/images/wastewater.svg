<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#stepBg)" />
  
  <!-- Biological Tank Monobloc Structure -->
  <g transform="translate(45, 50)">
    <!-- Container Tank Shell -->
    <rect x="10" y="30" width="290" height="110" rx="8" fill="#1E293B" stroke="#00A3E0" stroke-width="2.5" />
    
    <!-- Compartment Dividers -->
    <line x1="85" y1="30" x2="85" y2="140" stroke="#00A3E0" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="170" y1="30" x2="170" y2="140" stroke="#00A3E0" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="230" y1="30" x2="230" y2="140" stroke="#00A3E0" stroke-width="2" stroke-dasharray="4 2" />
    
    <!-- Water Levels -->
    <rect x="12" y="55" width="71" height="83" fill="#0284C7" opacity="0.35" />
    <rect x="87" y="50" width="81" height="88" fill="#0EA5E9" opacity="0.45" />
    <rect x="172" y="60" width="56" height="78" fill="#38BDF8" opacity="0.4" />
    <rect x="232" y="65" width="66" height="73" fill="#7DD3FC" opacity="0.5" />
    
    <!-- Aeration Bubbles in Biological Chamber (chamber 2) -->
    <circle cx="100" cy="115" r="4" fill="#E0F2FE" opacity="0.8" />
    <circle cx="115" cy="95" r="5" fill="#E0F2FE" opacity="0.7" />
    <circle cx="130" cy="120" r="3.5" fill="#E0F2FE" opacity="0.8" />
    <circle cx="145" cy="85" r="6" fill="#E0F2FE" opacity="0.9" />
    <circle cx="120" cy="70" r="4" fill="#E0F2FE" opacity="0.75" />
    
    <!-- Blower Piping -->
    <path d="M125 15 L125 130" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <circle cx="125" cy="15" r="8" fill="#F59E0B" />
    
    <!-- Clarifier Hopper V-shape in Chamber 3 -->
    <polygon points="175,95 200,135 225,95" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Inflow and Outflow arrows -->
    <path d="M-10 65 L8 65" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)" />
    <path d="M302 75 L320 75" stroke="#10B981" stroke-width="4" />
    
    <!-- Skid Base Frame -->
    <rect x="0" y="140" width="310" height="12" rx="3" fill="#334155" />
    
    <!-- Labels -->
    <text x="25" y="85" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8.5">DÉGRILLAGE</text>
    <text x="100" y="45" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="8.5">AÉRATION MBBR</text>
    <text x="180" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8.5">DÉCANTEUR</text>
    <text x="242" y="55" fill="#10B981" font-family="'Inter', sans-serif" font-size="8.5">EAU TRAITÉE</text>
  </g>

  <text x="30" y="38" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATION D’ÉPURATION COMPACTE</text>
  <text x="30" y="238" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">STEP Monobloc &amp; Traitement Biologique Flottant</text>
</svg>
