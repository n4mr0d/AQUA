<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="#0A192F" />
  
  <!-- Subtle Blueprint grid -->
  <g stroke="#38BDF8" stroke-width="0.5" opacity="0.12">
    <circle cx="200" cy="130" r="100" fill="none" />
    <circle cx="200" cy="130" r="60" fill="none" />
    <line x1="50" y1="130" x2="350" y2="130" />
    <line x1="200" y1="20" x2="200" y2="240" />
  </g>
  
  <!-- Industrial Volute Pump & High-Pressure Motor -->
  <g transform="translate(60, 50)">
    <!-- Electric Drive Motor Housing -->
    <rect x="20" y="45" width="100" height="70" rx="6" fill="url(#metalGrad)" stroke="#E2E8F0" stroke-width="2" />
    <!-- Cooling Fins -->
    <line x1="35" y1="45" x2="35" y2="115" stroke="#475569" stroke-width="3" />
    <line x1="50" y1="45" x2="50" y2="115" stroke="#475569" stroke-width="3" />
    <line x1="65" y1="45" x2="65" y2="115" stroke="#475569" stroke-width="3" />
    <line x1="80" y1="45" x2="80" y2="115" stroke="#475569" stroke-width="3" />
    <line x1="95" y1="45" x2="95" y2="115" stroke="#475569" stroke-width="3" />
    <!-- Motor Terminal Box -->
    <rect x="40" y="32" width="40" height="13" rx="2" fill="#334155" />
    
    <!-- Coupling Shaft Guard -->
    <rect x="120" y="65" width="25" height="30" fill="#64748B" />
    
    <!-- Volute Pump Casing (Spiral) -->
    <circle cx="185" cy="80" r="45" fill="url(#pumpGrad)" stroke="#38BDF8" stroke-width="3" />
    <!-- Impeller hub -->
    <circle cx="185" cy="80" r="16" fill="#0F172A" stroke="#00E5FF" stroke-width="2.5" />
    
    <!-- Suction Nozzle (Axial) -->
    <path d="M185 80 L185 140" stroke="#0284C7" stroke-width="22" stroke-linecap="round" />
    <rect x="165" y="135" width="40" height="10" rx="2" fill="#94A3B8" />
    
    <!-- Discharge Nozzle (Radial) -->
    <path d="M225 60 L270 40" stroke="#0284C7" stroke-width="20" stroke-linecap="round" />
    <rect x="260" y="28" width="12" height="36" rx="2" fill="#94A3B8" transform="rotate(25 260 28)" />
    
    <!-- Baseplate Skid -->
    <rect x="10" y="145" width="260" height="15" rx="3" fill="#1E293B" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Technical badges -->
  <text x="30" y="38" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">HIGH-PRESSURE HYDRAULIC</text>
  <text x="30" y="238" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Pompes Andritz - Surface, Immergées &amp; Dessalement</text>
</svg>
